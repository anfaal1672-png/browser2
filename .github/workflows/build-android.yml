name: Build Android APK

# Every branch, like the IPA workflow: pinned to one branch, Android changes
# on any other branch were never compiled before merging.
on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build GameBrowser (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The Robolectric smoke tests drive MainActivity's real cold-start
      # lifecycle -- exactly the launch crashes this project has shipped
      # before -- but nothing ran them, so they could only catch a regression
      # if someone remembered to run them locally.
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
