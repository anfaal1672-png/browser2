name: Build Android APK

# Every branch, like the IPA workflow: pinned to one branch, Android changes
# on any other branch were never compiled before merging.
on:
  push:
    branches:
      - "**"
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build GameBrowser (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Needed to publish the rolling release below; the default token is
    # read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The Robolectric smoke tests drive MainActivity's real cold-start
      # lifecycle -- exactly the launch crashes this project has shipped
      # before -- but nothing ran them, so they could only catch a regression
      # if someone remembered to run them locally.
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Actions artifacts can only be downloaded by someone logged in to
      # GitHub, and a phone browser that isn't logged in silently saves the
      # login page under the artifact's name -- which then fails to unzip.
      # A release asset is a plain, unauthenticated direct link, and it hands
      # over the .ipa itself rather than a zip containing a zip containing it.
      - name: Publish to the branch's rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="build-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          NOTES="Unsigned build of \`$BRANCH\` at $GITHUB_SHA.

          The IPA is deliberately unsigned, so it cannot be installed by
          tapping it -- it needs a signing tool (TrollStore, Sideloadly,
          AltStore, ...). The APK is debug-signed and installs directly.

          Each file is replaced whenever its own workflow runs."
          # Tolerates the other platform's job having created it first.
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$BRANCH (latest build)" \
            --notes "$NOTES" || true
          gh release edit "$TAG" --notes "$NOTES" || true
          cp android/app/build/outputs/apk/debug/app-debug.apk GameBrowser.apk
          gh release upload "$TAG" GameBrowser.apk --clobber
