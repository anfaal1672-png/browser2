name: Build unsigned IPA

# Public repo: GitHub-hosted macOS runners are unlimited/free, so every push
# to any branch triggers a build automatically -- the same policy
# codemagic.yaml already uses (branch pattern "*"). Pinning this to one
# branch meant work on any other branch produced no IPA to download and no
# compile check. workflow_dispatch is kept for on-demand re-runs.
on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

jobs:
  quick-check:
    name: Quick compile check (simulator)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Simulator builds compile much faster than a device build and need no
      # signing at all — this catches Swift compile errors in ~1-2 minutes
      # instead of waiting through the full device build to find out.
      - name: Build for simulator (compile-only, fail fast)
        run: |
          xcodebuild build \
            -project "GameBrowser.xcodeproj" \
            -scheme "GameBrowser" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO

  build:
    name: Build GameBrowser (unsigned)
    needs: quick-check
    runs-on: macos-14
    timeout-minutes: 30
    # Needed to publish the rolling release below; the default token is
    # read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build without code signing
        run: |
          xcodebuild build \
            -project "GameBrowser.xcodeproj" \
            -scheme "GameBrowser" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload as zip (rename to .ipa after download)
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/GameBrowser.app"
          test -d "$APP_PATH" || { echo "app not found"; exit 1; }
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qry GameBrowser.zip Payload
          cp GameBrowser.zip GameBrowser.ipa
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-ipa
          path: |
            dist/GameBrowser.zip
            dist/GameBrowser.ipa
          retention-days: 14

      # Actions artifacts can only be downloaded by someone logged in to
      # GitHub, and a phone browser that isn't logged in silently saves the
      # login page under the artifact's name -- which then fails to unzip.
      # A release asset is a plain, unauthenticated direct link, and it hands
      # over the .ipa itself rather than a zip containing a zip containing it.
      - name: Publish to the branch's rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="build-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          NOTES="Unsigned build of \`$BRANCH\` at $GITHUB_SHA.

          The IPA is deliberately unsigned, so it cannot be installed by
          tapping it -- it needs a signing tool (TrollStore, Sideloadly,
          AltStore, ...). The APK is debug-signed and installs directly.

          Each file is replaced whenever its own workflow runs."
          # Tolerates the other platform's job having created it first.
          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$BRANCH (latest build)" \
            --notes "$NOTES" || true
          gh release edit "$TAG" --notes "$NOTES" || true
          gh release upload "$TAG" dist/GameBrowser.ipa --clobber
